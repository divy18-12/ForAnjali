
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>For Yashika</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="garden" aria-hidden="false"></div>

  <div id="message" role="status" aria-live="polite">
    <div class="card">
      <p class="line1">Hope this makes you smile</p>
      <p class="line2">just wanted to make your day</p>
    </div>
  </div>

 <audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

function startMusic() {
    music.play().catch(() => {});
    document.removeEventListener("click", startMusic);
    document.removeEventListener("touchstart", startMusic);
}

document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);
</script>

  <div id="petals" aria-hidden="true"></div>
  <div id="butterflies" aria-hidden="true"></div>
  <div id="hearts" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
